name: ubuntu-touch
run-name: >-
  ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && format('Release · {0}', github.ref_name) || github.event_name == 'push' && github.event.head_commit.message || format('CI · manual · run {0}', github.run_number) }}

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    paths-ignore:
      - "README.md"
      - ".gitignore"
  workflow_dispatch:

# Grouped per ref; new runs queue instead of killing the in-flight one so a
# long provisioning step never dies with "The operation was canceled."
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  CLICKABLE_VERSION: "8.10.0"
  SDK_IMAGE: clickable/amd64-ut24.04-1.x-arm64
  PROVISIONED_IMAGE: mininotes-ut-sdk:24.04-1.x-arm64

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.detect_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect application version (single source = CMakeLists.txt)
        id: detect_version
        run: |
          VERSION="$(sed -nE 's/^project\(mininotes VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Verify tag matches application version (release gate)
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$TAG_VERSION" != "$EXPECTED_VERSION" ]]; then
              echo "::error::tag \"$GITHUB_REF_NAME\" (version $TAG_VERSION) does not match application version $EXPECTED_VERSION"
              exit 1
            fi
            echo "Release tag $GITHUB_REF_NAME validated against application version $EXPECTED_VERSION"
          else
            echo "No release tag (ref: $GITHUB_REF_NAME) - CI-only build"
          fi

      - name: Install host build dependencies (Qt 6 + tooling)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            qt6-base-dev qt6-declarative-dev \
            qml6-module-qtquick qml6-module-qtquick-window \
            qml6-module-qtquick-controls qml6-module-qtquick-templates \
            qml6-module-qtquick-layouts \
            qml6-module-qtqml-workerscript \
            libqt6sql6-sqlite \
            click file
          python3 -m pip install --break-system-packages "clickable-ut==${{ env.CLICKABLE_VERSION }}"

      - name: Configure + build (host, backend tests)
        run: |
          cmake --preset linux-tests
          cmake --build --preset linux-tests

      - name: Run backend tests (QTest)
        run: |
          ctest --preset linux-tests

      - name: Verify architecture boundaries
        run: |
          set -euo pipefail

          if grep -RInE '#include[[:space:]]*["<].*(QSql|QSqlDatabase|QSqlQuery|sqlite)' src/domain src/application 2>/dev/null; then
            echo "::error::Domain/Application layers must not depend on SQLite/QSql"
            exit 1
          fi

          if grep -RInE 'SqliteNoteRepository|data/sqlite' src/presentation src/application 2>/dev/null; then
            echo "::error::Presentation/Application layers must not depend on SqliteNoteRepository"
            exit 1
          fi

          echo "Architecture boundaries OK"

      - name: Build app (host) for QML E2E
        run: |
          cmake --preset linux-e2e
          cmake --build --preset linux-e2e

      - name: Headless QML/E2E check
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          MININOTES_E2E_TEST: "1"
        run: |
          set -e
          timeout 90 ./build/linux-e2e/mininotes > /tmp/e2e.log 2>&1 || true
          tail -15 /tmp/e2e.log
          grep -q "AUTOMATION: RESULT PASS" /tmp/e2e.log

      - name: Provision Ubuntu Touch SDK image (official base + Qt6 deps + reviewer 2404.2 policy data)
        run: |
          set -euxo pipefail
          # Official Clickable 24.04-1.x ARM64 builder image, provisioned on the
          # runner (no local artifacts). Dependencies declared in
          # clickable.yaml (dependencies_target) are preinstalled as root, and
          # image setup is skipped later so clickable does not regenerate an
          # image Dockerfile.
          docker pull "$SDK_IMAGE"
          docker run -d --name ut-sdk "$SDK_IMAGE" sleep infinity
          docker exec ut-sdk bash -lc \
            'apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
               qt6-base-dev qt6-declarative-dev libqt6sql6-sqlite'
          # click-reviewers-tools in the 24.04 archive ships apparmor policy
          # data only up to 2404.1 while the ubuntu-touch-24.04-1.x framework
          # uses 2404.2 -> reviewer DATA limitation (the runtime 2404.2 policy
          # exists in the SDK image itself), not a package defect. Add the
          # 2404.2 baseline to the reviewer as a copy of 2404.1 (the declarative
          # default for an empty policy_groups profile).
          cat > patch_reviewer.py <<'PY'
          import re
          p = "/usr/lib/python3/dist-packages/clickreviews/apparmor.py"
          s = open(p).read()
          pat = re.compile(r'(?m)^(?P<ind>[ \t]+)"2404\.1": \{(?P<body>.*?)^(?P=ind)\},', re.S)
          if '"2404.2"' not in s:
              m = pat.search(s)
              assert m, "2404.1 entry not found"
              ind, body = m.group('ind'), m.group('body')
              clone = ind + '"2404.2": {' + body + '\n' + ind + '},\n'
              s = s[:m.end()] + '\n' + clone + s[m.end():]
              open(p, 'w').write(s)
          compile(s, p, 'exec')
          print('apparmor.py patched:', '"2404.2"' in s)
          PY
          docker cp patch_reviewer.py ut-sdk:/tmp/patch_reviewer.py
          docker exec ut-sdk python3 /tmp/patch_reviewer.py
          docker commit ut-sdk "$PROVISIONED_IMAGE"
          docker rm -f ut-sdk

      - name: Build ARM64 Click package (clickable)
        env:
          CLICKABLE_DOCKER_COMMAND: docker
        run: |
          clickable build --arch arm64 --docker-image "$PROVISIONED_IMAGE" --skip-image-setup
          test -f "build/aarch64-linux-gnu/app/mininotes_${EXPECTED_VERSION}_arm64.click"
          ls -la "build/aarch64-linux-gnu/app/mininotes_${EXPECTED_VERSION}_arm64.click"

      - name: Validate package metadata and contents
        env:
          EXPECTED_VERSION: ${{ env.EXPECTED_VERSION }}
        run: |
          set -euxo pipefail
          CLICK_OUT="build/aarch64-linux-gnu/app/mininotes_${EXPECTED_VERSION}_arm64.click"
          click info "$CLICK_OUT" > /tmp/info.json
          cat /tmp/info.json
          EXPECTED_VERSION="$EXPECTED_VERSION" python3 - <<'PY'
          import json, os
          expected = os.environ["EXPECTED_VERSION"]
          m = json.load(open("/tmp/info.json"))
          assert m["architecture"] == "arm64", m
          assert m["framework"] == "ubuntu-touch-24.04-1.x", m
          assert m["name"] == "mininotes", m
          assert m["title"] == "MiniNotes", m
          assert m["version"] == expected, (m["version"], expected)
          assert "mininotes" in m["hooks"]
          assert "apparmor" in m["hooks"]["mininotes"]
          assert "desktop" in m["hooks"]["mininotes"]
          print("manifest OK")
          PY
          click contents "$CLICK_OUT"
          rm -rf /tmp/pk && mkdir -p /tmp/pk && dpkg-deb -x "$CLICK_OUT" /tmp/pk
          dpkg-deb -e "$CLICK_OUT" /tmp/pk/DEBIAN
          file /tmp/pk/mininotes | grep -q "ARM aarch64"
          for f in \
            mininotes \
            qml/Main.qml \
            qml/pages/CreateNotePage.qml \
            qml/pages/EditNotePage.qml \
            qml/pages/NotesListPage.qml \
            qml/theme/UiMetrics.qml \
            mininotes.apparmor \
            mininotes.desktop \
            assets/icons/mininotes.svg; do
            test -f "/tmp/pk/$f"
          done
          python3 -c "import json; json.load(open('/tmp/pk/mininotes.apparmor'))"
          grep -q '"architecture": "arm64"' /tmp/pk/DEBIAN/manifest
          grep -q '"framework": "ubuntu-touch-24.04-1.x"' /tmp/pk/DEBIAN/manifest
          grep -q "\"version\": \"${EXPECTED_VERSION}\"" /tmp/pk/DEBIAN/manifest
          echo "package validation OK"

      - name: Upload .click artifact
        uses: actions/upload-artifact@v4
        with:
          name: mininotes-ubuntu-touch-arm64
          path: build/aarch64-linux-gnu/app/mininotes_${{ env.EXPECTED_VERSION }}_arm64.click
          if-no-files-found: error
          retention-days: 30

  linux_release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Qt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            qt6-base-dev \
            qt6-declarative-dev \
            qml6-module-qtquick \
            qml6-module-qtquick-window \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-layouts \
            qml6-module-qtqml-workerscript \
            libqt6sql6-sqlite

      - name: Build Linux Desktop release
        run: |
          cmake --preset linux-release
          cmake --build --preset linux-release

          test -x build/linux-release/mininotes

      - name: Package Linux Desktop
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euxo pipefail

          VERSION="${VERSION#v}"
          PACKAGE_DIR="mininotes-${VERSION}-linux-x86_64"
          ARCHIVE="mininotes-${VERSION}-linux-x86_64.tar.gz"

          rm -rf "dist/$PACKAGE_DIR"
          mkdir -p "dist/$PACKAGE_DIR"

          cp build/linux-release/mininotes \
             "dist/$PACKAGE_DIR/"

          cp -R build/linux-release/qml \
             "dist/$PACKAGE_DIR/"

          mkdir -p \
            "dist/$PACKAGE_DIR/assets/icons"

          cp assets/icons/mininotes.svg \
             "dist/$PACKAGE_DIR/assets/icons/"

          cp mininotes.desktop \
             "dist/$PACKAGE_DIR/"

          cat > "dist/$PACKAGE_DIR/README.txt" <<EOF
          MiniNotes ${VERSION}
          Linux x86_64 desktop build

          Run:
            ./mininotes

          Runtime:
            Qt 6
            SQLite

          The application stores its data using the operating system's
          application data location.
          EOF

          tar -C dist \
            -czf "dist/$ARCHIVE" \
            "$PACKAGE_DIR"

          test -f "dist/$ARCHIVE"
          ls -lh "dist/$ARCHIVE"

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v4
        with:
          name: mininotes-linux-x86_64
          path: dist/mininotes-*-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30


  linux_deb:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.detect_version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect application version
        id: detect_version
        run: |
          set -euo pipefail

          VERSION="$(sed -nE 's/^project\(mininotes VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)"

          test -n "$VERSION"

          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"

            if [[ "$TAG_VERSION" != "$VERSION" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match application version $VERSION"
              exit 1
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            cmake \
            dpkg-dev \
            fakeroot \
            qt6-base-dev \
            qt6-declarative-dev \
            qml6-module-qtquick \
            qml6-module-qtquick-window \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-layouts \
            qml6-module-qtqml-workerscript \
            libqt6sql6-sqlite

      - name: Configure Linux package build
        run: |
          cmake --preset linux-package

      - name: Build Linux package target
        run: |
          cmake --build --preset linux-package

      - name: Build DEB package
        run: |
          set -euxo pipefail

          cpack \
            --config build/linux-package/CPackConfig.cmake \
            -G DEB

          DEB="$(find . \
            -maxdepth 1 \
            -type f \
            -name 'mininotes_*.deb' \
            -print -quit)"

          test -n "$DEB"

          mkdir -p dist

          cp "$DEB" \
            "dist/mininotes_${{ steps.detect_version.outputs.version }}_amd64.deb"

          echo "===== DEB INFO ====="
          dpkg-deb -I "$DEB"

          echo "===== DEB CONTENTS ====="
          dpkg-deb -c "$DEB" | grep -E \
            '(/usr/bin/mininotes|/usr/share/mininotes|applications/|icons/|metainfo/)'

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: mininotes-linux-amd64-deb
          path: dist/mininotes_*_amd64.deb
          if-no-files-found: error
          retention-days: 30

  release:
    needs:
      - build
      - linux_release
      - linux_deb
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Ubuntu Touch artifact
        uses: actions/download-artifact@v4
        with:
          name: mininotes-ubuntu-touch-arm64
          path: dist/ubuntu-touch

      - name: Download Linux Desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: mininotes-linux-x86_64
          path: dist/linux

      - name: Download Linux DEB artifact
        uses: actions/download-artifact@v4
        with:
          name: mininotes-linux-amd64-deb
          path: dist/deb

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail

          VERSION="${{ needs.build.outputs.version }}"
          TAG="$GITHUB_REF_NAME"

          test "$TAG" = "v${VERSION}"

          CLICK_FILE="dist/ubuntu-touch/mininotes_${VERSION}_arm64.click"
          LINUX_FILE="dist/linux/mininotes-${VERSION}-linux-x86_64.tar.gz"
          DEB_FILE="dist/deb/mininotes_${VERSION}_amd64.deb"

          test -f "$CLICK_FILE"
          test -f "$LINUX_FILE"
          test -f "$DEB_FILE"

          cat > release-notes.md <<EOF
          # MiniNotes $TAG

          ## Features

          - Create Note
          - SQLite persistence
          - C++ backend
          - QML/Qt6 UI
          - UTF-8 / Arabic / emoji support

          ## Targets

          - Ubuntu Touch 24.04-1.x / ARM64
          - Linux desktop / x86_64

          ## Artifacts

          - mininotes_${VERSION}_arm64.click
          - mininotes-${VERSION}-linux-x86_64.tar.gz
          - mininotes_${VERSION}_amd64.deb

          ## Experimental status

          This is an experimental development release.
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "$CLICK_FILE" \
              "$LINUX_FILE" \
              "$DEB_FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" \
              "$CLICK_FILE" \
              "$LINUX_FILE" \
              "$DEB_FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --title "MiniNotes $TAG" \
              --notes-file release-notes.md
          fi
