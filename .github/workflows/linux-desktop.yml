name: linux-desktop

run-name: >-
  ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && format('Linux Desktop · Release · {0}', github.ref_name) || github.event_name == 'push' && github.event.head_commit.message || format('Linux Desktop · manual · run {0}', github.run_number) }}

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    paths-ignore:
      - "README.md"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Qt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            qt6-base-dev \
            qt6-declarative-dev \
            qml6-module-qtquick \
            qml6-module-qtquick-window \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-layouts \
            qml6-module-qtqml-workerscript \
            libqt6sql6-sqlite

      - name: Build Linux Desktop release
        run: |
          cmake --preset linux-release
          cmake --build --preset linux-release
          test -x build/linux-release/mininotes

      - name: Build + test Linux Desktop backend
        run: |
          cmake --preset linux-tests
          cmake --build --preset linux-tests
          ctest --preset linux-tests

      - name: Build Linux Desktop QML E2E target
        run: |
          cmake --preset linux-e2e
          cmake --build --preset linux-e2e

      - name: Run Linux Desktop QML E2E
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          MININOTES_E2E_TEST: "1"
        run: |
          set -euo pipefail
          timeout 90 ./build/linux-e2e/mininotes > /tmp/mininotes-e2e.log 2>&1 || true
          tail -20 /tmp/mininotes-e2e.log
          grep -q "AUTOMATION: RESULT PASS" /tmp/mininotes-e2e.log

      - name: Run Linux Desktop startup smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          MININOTES_SMOKE_TEST: "1"
        run: |
          set -euo pipefail
          timeout 15 ./build/linux-release/mininotes > /tmp/mininotes-smoke.log 2>&1
          cat /tmp/mininotes-smoke.log
          grep -q "MiniNotes QML root loaded successfully" /tmp/mininotes-smoke.log
