name: flatpak

on:
  push:
    branches: ["main"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flatpak:
    name: Flatpak
    runs-on: ubuntu-24.04

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          manifest-path: io.github.ahmadabdelbary2001.mininote.yml
          bundle: mininotes.flatpak
          cache: true
          restore-cache: true
          save-cache: true
          upload-artifact: true
          artifact-name: mininotes-flatpak
          verbose: true

  publish:
    name: Publish Flatpak to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - flatpak
    runs-on: ubuntu-24.04

    permissions:
      contents: write
      actions: read

    steps:
      - name: Download Flatpak artifact
        uses: actions/download-artifact@v4
        with:
          name: mininotes-flatpak
          path: dist

      - name: Wait for GitHub Release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="$GITHUB_REF_NAME"
          REPO="$GITHUB_REPOSITORY"
          SHA="$GITHUB_SHA"

          for attempt in $(seq 1 360); do
            if gh release view "$TAG" \
              --repo "$REPO" >/dev/null 2>&1; then
              echo "Release $TAG is available."
              exit 0
            fi

            RUN_JSON="$(
              gh run list \
                --repo "$REPO" \
                --workflow ubuntu-touch.yml \
                --commit "$SHA" \
                --limit 1 \
                --json databaseId,status,conclusion \
                --jq '.[0] // empty'
            )"

            if [[ -n "$RUN_JSON" ]]; then
              RUN_ID="$(jq -r '.databaseId' <<<"$RUN_JSON")"
              STATUS="$(jq -r '.status' <<<"$RUN_JSON")"
              CONCLUSION="$(jq -r '.conclusion // ""' <<<"$RUN_JSON")"

              echo "ubuntu-touch run $RUN_ID: status=$STATUS conclusion=${CONCLUSION:-pending}"

              if [[ "$STATUS" == "completed" ]]; then
                if [[ "$CONCLUSION" != "success" ]]; then
                  echo "::error::ubuntu-touch workflow failed: $CONCLUSION"
                  exit 1
                fi

                echo "ubuntu-touch workflow succeeded; waiting for Release visibility..."
              fi
            else
              echo "ubuntu-touch workflow for commit $SHA is not visible yet..."
            fi

            sleep 10
          done

          echo "::error::Timed out waiting for Release $TAG."
          exit 1

      - name: Upload Flatpak to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          test -f dist/mininotes.flatpak

          ls -lh dist/mininotes.flatpak

          gh release upload \
            "$GITHUB_REF_NAME" \
            dist/mininotes.flatpak \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
