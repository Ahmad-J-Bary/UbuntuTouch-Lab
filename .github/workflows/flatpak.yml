name: flatpak

on:
  push:
    branches: ["main"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flatpak:
    name: Flatpak
    runs-on: ubuntu-24.04

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          manifest-path: io.github.ahmadabdelbary2001.mininote.yml
          bundle: mininotes.flatpak
          cache: true
          restore-cache: true
          save-cache: true
          upload-artifact: true
          artifact-name: mininotes-flatpak
          verbose: true

  publish:
    name: Publish Flatpak to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - flatpak
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Download Flatpak artifact
        uses: actions/download-artifact@v4
        with:
          name: mininotes-flatpak
          path: dist

      - name: Wait for GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            if gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $GITHUB_REF_NAME is available."
              break
            fi

            echo "Release $GITHUB_REF_NAME is not available yet; retrying..."
            sleep 5
          done

          gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Upload Flatpak to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          test -f dist/mininotes.flatpak

          ls -lh dist/mininotes.flatpak

          gh release upload \
            "$GITHUB_REF_NAME" \
            dist/mininotes.flatpak \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
