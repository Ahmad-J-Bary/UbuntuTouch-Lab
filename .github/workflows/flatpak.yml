name: flatpak

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flatpak:
    name: Flatpak
    runs-on: ubuntu-24.04

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          manifest-path: io.github.Ahmad_J_Bary.UbuntuTouch-Lab.yml
          bundle: mininotes.flatpak
          cache: true
          restore-cache: true
          save-cache: true
          upload-artifact: true
          artifact-name: mininotes-flatpak
          verbose: true
